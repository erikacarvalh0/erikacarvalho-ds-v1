name: Browser visual
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
      - run: bash scripts/test-visual.sh
      - uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: visual-smoke.png
