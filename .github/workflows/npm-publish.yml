name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.6.2
      - run: yarn install --frozen-lockfile
      - run: node -e "if(require('./package.json').version!==process.env.EXPECTED_VERSION) throw Error('Version mismatch')"
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - run: npm run prepack
      - run: node scripts/consumer-smoke.cjs
      - run: npm pack --ignore-scripts
      - run: npm publish ./*.tgz --access public --provenance
