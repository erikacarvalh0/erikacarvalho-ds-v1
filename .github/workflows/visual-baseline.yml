name: Visual baseline comparison
on: pull_request
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile && bash scripts/test-visual.sh
        working-directory: baseline
      - run: yarn install --frozen-lockfile && bash scripts/test-visual.sh
        working-directory: candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-comparison
          path: |
            baseline/visual-smoke.png
            candidate/visual-smoke.png
      - run: cmp baseline/visual-smoke.png candidate/visual-smoke.png
