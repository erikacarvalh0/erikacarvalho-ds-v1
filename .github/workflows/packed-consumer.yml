name: Packed consumer
on:
  pull_request:
  workflow_dispatch:
jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
      - run: bash scripts/test-packed-consumer.sh
