name: Consumer smoke
on:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install
      - run: yarn webpack --config webpack.library.config.js --mode production
      - run: node scripts/consumer-smoke.cjs
